[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chatbot-sicherheitstester"
version = "0.1.0"
description = "Attacks German-language chatbots and reports weaknesses."
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = ["httpx", "fastapi", "uvicorn", "jinja2", "pyyaml"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.j2", "*.md", "*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
